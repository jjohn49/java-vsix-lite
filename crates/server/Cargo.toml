[package]
name = "jvl-server"
description = "java-vsix-lite language server (pure-Rust default tier + optional Java-tier supervisor)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "jvl-server"
path = "src/main.rs"

[dependencies]
jvl-classpath = { version = "0.1.0", path = "../classpath" }
jvl-debug = { version = "0.1.0", path = "../debug" }
jvl-syntax = { version = "0.1.0", path = "../syntax" }
serde = { version = "1.0.228", features = ["derive"] }
# M5.2: promoted from dev-dependencies — `initialized()` now serializes
# `DidChangeWatchedFilesRegistrationOptions` into the `Registration.register_options`
# JSON value for the build-file watch. Already a transitive dependency (ls-types,
# tower-lsp-server); this only makes it nameable from non-test code, with no change
# to the resolved version or Cargo.lock's crate set.
serde_json = "1.0.150"
tokio.workspace = true
tower-lsp-server = "0.23.0"
tracing.workspace = true
tracing-subscriber.workspace = true
# tower-lsp-server is added via `cargo add` so the exact version is recorded here
# and in Cargo.lock.
