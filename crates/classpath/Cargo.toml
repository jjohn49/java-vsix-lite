[package]
name = "jvl-classpath"
description = "Reads JDK/dependency .class bytecode (via cafebabe) to provide signature-level symbols for imported types — no JVM, no build execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cafebabe = "0.9.0"
miniz_oxide = "0.9.1"
# cafebabe (pure-Rust class-file parser) + miniz_oxide (pure-Rust DEFLATE) are
# added via `cargo add` so exact versions are pinned in Cargo.lock.
