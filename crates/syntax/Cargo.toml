[package]
name = "jvl-syntax"
description = "tree-sitter-java parsing, position mapping, and syntax-level analysis for the default tier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ls-types = "0.0.6"
serde_json = "1.0.150"
tree-sitter = "0.26.9"
tree-sitter-java = "0.23.5"
jvl-types = { path = "../types" }
# tree-sitter + grammar and ls-types added via `cargo add` so versions are
# pinned in Cargo.lock. tree-sitter-java must be ABI-compatible with the
# tree-sitter binding version (cargo resolves this).
