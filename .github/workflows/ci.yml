name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only by default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tests must not touch the network (supply-chain / least-privilege invariant).
  # cargo is already offline after the explicit fetch step below.
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --offline

  cargo-deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  extension:
    name: VS Code extension (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Type-check
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package dry-run
        # Verifies the VSIX can be assembled without network access; uses the
        # vsce binary installed by npm ci above (--no-install enforces this,
        # so vsce cannot silently fall back to fetching itself). Same flags as
        # release.yml's package step minus its per-platform --target — this is
        # a packaging-rot check, not a shippable artifact.
        # --no-dependencies skips vsce's own npm dependency scan,
        # which is unnecessary (and would need network) since node_modules is
        # already excluded from the VSIX via .vscodeignore.
        run: npx --no-install @vscode/vsce package --no-dependencies --out /tmp/java-vsix-lite-ci.vsix

  # M8g: alpine/musl is a shipped release target (code-server hosts) — run
  # the full Rust suite against it, not just a cross-build.
  rust-alpine:
    name: Rust tests (alpine/musl)
    runs-on: ubuntu-latest
    container: rust:alpine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install build tools
        run: apk add --no-cache build-base
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Test
        run: cargo test --workspace --locked --offline

  # M8g: extension integration tests — a real VS Code host loads the built
  # extension + server and the suite asserts on the editor-side diagnostics
  # collection (the layer the M7 publishDiagnostics-swallowing bug broke
  # while every server-side test stayed green).
  extension-integration:
    name: VS Code extension (integration)
    runs-on: ubuntu-latest
    env:
      # A JDK is installed below — the javac test must run, never skip.
      JVL_TEST_REQUIRE_JAVAC: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build server
        run: cargo build -p jvl-server --locked
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install (locked)
        working-directory: editors/vscode
        run: npm ci
      - name: Integration tests
        working-directory: editors/vscode
        run: xvfb-run -a npm test
