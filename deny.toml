# cargo-deny configuration — the Rust side of the supply-chain gate (see
# docs/THREAT_MODEL.md). Run locally with `cargo deny check`; enforced in CI.

[advisories]
version = 2
# Fail the build on any security advisory in the dependency tree. No silent
# acceptance — additions to `ignore` must be justified in review.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only; this project is MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
# Surface duplicate versions (bloat) and forbid wildcard version requirements
# (a supply-chain footgun).
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only the official crates.io registry; no unvetted git or alternative sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
